version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # These pins must track the tested BB release together.
      - dependency-name: '@get-bb/plugin-sdk'
      - dependency-name: bb-app
      # Keep type declarations aligned with the Node 22 CI/runtime baseline.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
